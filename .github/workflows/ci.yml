name: CI

on:
    pull_request:
    push:
        branches: [main, develop]

# A new push to the same branch cancels the run already in flight.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  # Reads .nvmrc, so CI and local development can't drift.
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            # Ordered cheapest-first so an obvious failure reports in seconds
            # rather than after a full build.
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build
